name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Pull requests from forks get a read-only token. Never switch this to
# pull_request_target: it would run contributor code with write access.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check connectors and automation templates
        run: node scripts/validate.mjs

      - name: Check catalog.json is up to date
        run: node scripts/build-catalog.mjs --check

      - name: Test the checks
        run: node --test scripts/validate.test.mjs
